name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get Buildozer Docker Image
        run: docker pull substrait/buildozer:latest

      - name: Compile APK via Docker
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/home/user/hostdir \
            substrait/buildozer:latest \
            android debug

      - name: Upload Finished APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: bin/*.apk
